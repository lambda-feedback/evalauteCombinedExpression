[tool.poetry]
name = "evaluation_function"
version = "0.0.1"
description = ""
authors = ["Andreas Pfurtscheller <andreas.pfurtscheller23@ic.ac.uk>"]
readme = "README.md"
packages = [{ include = "evaluation_function" }]

[tool.poetry.scripts]
evaluation_function = "evaluation_function.main:main"
evaluation_function_dev = "evaluation_function.dev:dev"

[tool.poetry.dependencies]
# <3.13: latex2sympy2 (via lambdafeedback-expression-parsing) pins
# antlr4-python3-runtime 4.7.2, which imports `typing.io`, removed in 3.13.
python = ">=3.11,<3.13"
typing_extensions = "^4.12.2"
lf_toolkit = { git = "https://github.com/lambda-feedback/toolkit-python.git", branch = "main", extras = [
    "ipc",
] }
sympy = ">=1.12,<2.0"
# Parsing and units machinery extracted from compareExpressions. All four are
# listed (same rev) so the sibling dependencies resolve from git, not PyPI.
lambdafeedback-slr-parsing = { git = "https://github.com/m-messer/lambda-feedback-packages.git", rev = "865d39999fdf9fc63839d6b1690eab2b6f3c432d", subdirectory = "slr_parsing" }
lambdafeedback-expression-parsing = { git = "https://github.com/m-messer/lambda-feedback-packages.git", rev = "865d39999fdf9fc63839d6b1690eab2b6f3c432d", subdirectory = "expression_parsing" }
lambdafeedback-units = { git = "https://github.com/m-messer/lambda-feedback-packages.git", rev = "865d39999fdf9fc63839d6b1690eab2b6f3c432d", subdirectory = "units" }

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.2"
flake8 = "^7.1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
